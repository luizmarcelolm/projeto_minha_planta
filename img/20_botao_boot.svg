<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600" font-family="Segoe UI, Roboto, Ubuntu, sans-serif">
  <defs>
    <radialGradient id="brilho" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4d8dff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f08c00"/>
    </marker>
  </defs>
  <rect width="780" height="600" fill="#eaf1e4"/>
  <text x="390" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#3f7a2e">Segure o BOOT por 5 segundos</text>

  <!-- cabo USB-C -->
  <rect x="373" y="470" width="34" height="130" fill="#2b2b2b"/>
  <rect x="362" y="448" width="56" height="44" rx="7" fill="#2b2b2b"/>

  <!-- placa ESP32-C3 -->
  <rect x="280" y="90" width="220" height="350" rx="14" fill="#1d1d1f" stroke="#000" stroke-width="3"/>
  <rect x="345" y="104" width="90" height="20" rx="3" fill="#e8e8e8"/>
  <g fill="#d4a53c">
    <circle cx="308" cy="150" r="7"/><circle cx="308" cy="183" r="7"/><circle cx="308" cy="216" r="7"/><circle cx="308" cy="249" r="7"/>
    <circle cx="308" cy="282" r="7"/><circle cx="308" cy="315" r="7"/><circle cx="308" cy="348" r="7"/><circle cx="308" cy="381" r="7"/>
    <circle cx="472" cy="150" r="7"/><circle cx="472" cy="183" r="7"/><circle cx="472" cy="216" r="7"/><circle cx="472" cy="249" r="7"/>
    <circle cx="472" cy="282" r="7"/><circle cx="472" cy="315" r="7"/><circle cx="472" cy="348" r="7"/><circle cx="472" cy="381" r="7"/>
  </g>
  <g fill="#1d1d1f">
    <circle cx="308" cy="150" r="3"/><circle cx="308" cy="183" r="3"/><circle cx="308" cy="216" r="3"/><circle cx="308" cy="249" r="3"/>
    <circle cx="308" cy="282" r="3"/><circle cx="308" cy="315" r="3"/><circle cx="308" cy="348" r="3"/><circle cx="308" cy="381" r="3"/>
    <circle cx="472" cy="150" r="3"/><circle cx="472" cy="183" r="3"/><circle cx="472" cy="216" r="3"/><circle cx="472" cy="249" r="3"/>
    <circle cx="472" cy="282" r="3"/><circle cx="472" cy="315" r="3"/><circle cx="472" cy="348" r="3"/><circle cx="472" cy="381" r="3"/>
  </g>
  <rect x="337" y="170" width="106" height="92" rx="5" fill="#2a2a2d" stroke="#555" stroke-width="1.5"/>
  <text x="390" y="222" text-anchor="middle" font-size="17" fill="#aaa">C3</text>

  <!-- LED azul aceso -->
  <circle cx="337" cy="296" r="40" fill="url(#brilho)"/>
  <rect x="328" y="289" width="18" height="15" rx="2" fill="#e6efff"/>

  <!-- botoes: RST a esquerda, BOOT a direita (USB-C para baixo) -->
  <rect x="318" y="323" width="38" height="26" rx="4" fill="#9a9a9a"/>
  <text x="337" y="370" text-anchor="middle" font-size="13" fill="#999">RST</text>
  <rect x="424" y="323" width="38" height="26" rx="4" fill="#e8e8e8"/>
  <text x="443" y="370" text-anchor="middle" font-size="13" fill="#ddd" font-weight="700">BOOT</text>

  <!-- conector USB-C da placa -->
  <rect x="364" y="410" width="52" height="40" rx="8" fill="#c9c9c9" stroke="#888" stroke-width="1.5"/>
  <rect x="377" y="424" width="26" height="12" rx="6" fill="#555"/>

  <!-- destaque do BOOT -->
  <rect x="415" y="314" width="56" height="44" rx="9" fill="none" stroke="#f08c00" stroke-width="4"/>
  <path d="M590 336 L480 336" stroke="#f08c00" stroke-width="6" stroke-linecap="round" marker-end="url(#ponta)"/>
  <rect x="588" y="288" width="168" height="96" rx="12" fill="#fff" stroke="#f08c00" stroke-width="3"/>
  <text x="672" y="320" text-anchor="middle" font-size="22" font-weight="800" fill="#c25e00">BOOT</text>
  <text x="672" y="346" text-anchor="middle" font-size="16" fill="#333">segure por</text>
  <text x="672" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#333">5 segundos</text>

  <!-- RST: nao e este -->
  <path d="M192 420 L322 350" stroke="#8a8a8a" stroke-width="2.5"/>
  <rect x="24" y="398" width="168" height="62" rx="12" fill="#fff" stroke="#9a9a9a" stroke-width="2"/>
  <text x="108" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#555">RST</text>
  <text x="108" y="446" text-anchor="middle" font-size="15" fill="#666">n&#227;o &#233; este</text>

  <!-- LED -->
  <path d="M192 250 L324 294" stroke="#2f5f9e" stroke-width="2.5"/>
  <rect x="24" y="214" width="168" height="72" rx="12" fill="#fff" stroke="#3b7ddd" stroke-width="2"/>
  <text x="108" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4f9e">LED azul</text>
  <text x="108" y="266" text-anchor="middle" font-size="15" fill="#1f4f9e">fica aceso fixo</text>

  <!-- cabo -->
  <path d="M192 540 L365 540" stroke="#555" stroke-width="2.5"/>
  <rect x="24" y="508" width="168" height="64" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="108" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Planta ligada</text>
  <text x="108" y="556" text-anchor="middle" font-size="14" fill="#555">no cabo USB-C</text>
</svg>
